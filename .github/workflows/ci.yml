name: CI

# The repo already carries four checks that exit non-zero on failure and were
# only ever run by hand. This is what runs them.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # SQLite in the workspace: the suite builds its own schema from the
      # migrations, so nothing external has to exist for CI to be meaningful.
      DATABASE_URL: file:./ci.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `postinstall` runs `prisma generate`, so the client is ready from here.
      - run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Colour is parameterised by one hue variable per theme, which is only
      # safe if something proves the whole matrix on every change.
      - name: Contrast (7 accents × 2 modes)
        run: node scripts/contrast-check.mjs

      - name: Browsers
        run: npx playwright install --with-deps chromium

      # Builds and starts the app itself, per playwright.config.ts.
      - name: End to end
        run: npm run test:e2e

      # Renders the app in every OS-preference × explicit-choice combination and
      # reads the colours the browser computed — the CSS agreeing with itself is
      # not the same as the page agreeing with the CSS.
      - name: Theme matrix
        run: |
          NEXT_DIST_DIR=.next-ci npx next build
          NEXT_DIST_DIR=.next-ci npx next start -p 3200 &
          # No wait-on dependency for one wait: poll until the port answers.
          # Deliberately not `curl -f` — with a basePath set, `/` is a 404, and
          # a 404 still means the server is up, which is all this waits for.
          for _ in $(seq 1 60); do
            curl -s -o /dev/null "http://localhost:3200" && break
            sleep 1
          done
          # The script derives the basePath from next.config.ts itself, so this
          # passes the origin only.
          SHOT_BASE=http://localhost:3200 node scripts/theme-matrix.mjs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
